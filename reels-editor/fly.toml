# Fly.io deploy config. Run `fly launch --no-deploy` once to create the app and
# set your app name, then `fly volumes create reels_data --size 3`, then `fly deploy`.
app = "reels-editor"
primary_region = "iad"

[build]

[env]
  STORAGE_DIR = "/data/storage"
  WHISPER_MODEL = "base"
  MAX_SOURCE_SECONDS = "180"
  MAX_UPLOAD_BYTES = "209715200"  # 200 MB

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # scale to zero when idle -> near-zero idle cost
  auto_start_machines = true
  min_machines_running = 0
  # Long jobs run in the background; keep concurrency at 1 to protect RAM.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 15

# Persistent disk for uploads / outputs.
[[mounts]]
  source = "reels_data"
  destination = "/data"

# Whisper + ffmpeg need headroom; 2 GB avoids OOM on `base` int8.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
