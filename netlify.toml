# Netlify configuration — serves the static landing page in /docs.
# Connect this repo at https://app.netlify.com (New site from Git) and Netlify
# will read this file automatically: no build step, publishes the docs folder.

[build]
  publish = "docs"
  command = ""

# The Kyan site used to live at /kyan; it is the landing page now.
[[redirects]]
  from = "/kyan"
  to = "/"
  status = 301

# Pretty 404 -> send unknown paths back to the landing page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
