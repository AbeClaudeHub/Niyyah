<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Diagnosis — Niyyah</title>
<meta name="description" content="Twelve scenarios. One pattern. Find out which nafs is running your trading account." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://niyyahtrader.com/diagnosis.html" />
<meta name="theme-color" content="#0a0d0b" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0d0b'/%3E%3Cg fill='none' stroke='%23c9a35f' stroke-width='5'%3E%3Crect x='26' y='26' width='48' height='48'/%3E%3Crect x='26' y='26' width='48' height='48' transform='rotate(45 50 50)'/%3E%3Ccircle cx='50' cy='50' r='8' stroke-width='4'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<style>
#app{min-height:100svh;padding:70px 0 40px;display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center}
.intro-card{text-align:center}
.intro-card h1{font-size:clamp(1.9rem,8vw,2.6rem);margin-bottom:.4em}
.intro-card p{color:var(--muted);max-width:36ch;margin:0 auto 1.8em}
.intro-card .meta{display:flex;justify-content:center;gap:20px;margin-bottom:2em;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.gate-card h1{font-size:clamp(1.7rem,7vw,2.2rem);margin-bottom:.4em}
.gate-card .sub{color:var(--muted);margin-bottom:1.6em}
.result-loading{text-align:center;color:var(--muted-2);font-size:.85rem}
</style>
</head>
<body>
<div class="wordmark">NIYYAH</div>
<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<main id="app" class="wrap"></main>

<script>
const ARCHETYPES = {
  impatience: { label: "Impatience" },
  greed:      { label: "Greed" },
  fear:       { label: "Fear" },
  pride:      { label: "Pride" },
  despair:    { label: "Despair" },
};
const TIE_PRIORITY = ["greed","pride","fear","impatience","despair"];

const QUESTIONS = [
  { q: "You're down on the day. It's thirty minutes before close. What's your honest impulse?",
    opts: [
      { t: "Size up on the next setup and take it all back at once.", a: "greed" },
      { t: "Force a trade right now — anything to not end the day red.", a: "impatience" },
      { t: "Close the platform. You're done, whatever happens next.", a: "fear" },
      { t: "Re-enter the exact trade that just stopped you out. It has to work eventually.", a: "pride" },
      { t: "Let it ride. Doesn't matter anymore tonight.", a: "despair" },
    ]},
  { q: "A trade hits your profit target early, clean, exactly as planned. What actually happens?",
    opts: [
      { t: "You move the target further out — this one's going bigger.", a: "greed" },
      { t: "You hold past it, to prove your read was even better than you planned.", a: "pride" },
      { t: "You'd already closed it three ticks before target, out of boredom.", a: "impatience" },
      { t: "You close it early, ahead of target, just to lock something in.", a: "fear" },
      { t: "You barely register it. You weren't expecting it to work anyway.", a: "despair" },
    ]},
  { q: "Price is one tick from your stop loss. What happens next?",
    opts: [
      { t: "You move the stop. You're not wrong — the market is.", a: "pride" },
      { t: "You add to the position at the worse price, to lower your average.", a: "greed" },
      { t: "You close it early, before the stop even triggers. You can't watch it lose.", a: "fear" },
      { t: "You stopped watching ten minutes ago and forgot the stop was even there.", a: "impatience" },
      { t: "You let it blow through. Part of you expected this trade to fail.", a: "despair" },
    ]},
  { q: "Your plan says wait for the candle to close before entering. What do you actually do?",
    opts: [
      { t: "Enter on the wick. Waiting feels unbearable.", a: "impatience" },
      { t: "Enter, then double the size mid-move because it's clearly working.", a: "greed" },
      { t: "Wait so long past confirmation that the good entry is already gone.", a: "fear" },
      { t: "Take a different setup entirely, because you know better than the plan.", a: "pride" },
      { t: "Skip it. Why bother — you'll ruin it somehow.", a: "despair" },
    ]},
  { q: "Three losses in a row. What do you do that night?",
    opts: [
      { t: "Skip the journal. What's the point — you'll probably quit anyway.", a: "despair" },
      { t: "Decide the losses were bad luck, not a bad process.", a: "pride" },
      { t: "Decide to trade half size, indefinitely, so this can't happen again.", a: "fear" },
      { t: "Go looking for a new strategy online. This one's clearly broken.", a: "impatience" },
      { t: "Plan a bigger size for tomorrow to make it all back at once.", a: "greed" },
    ]},
  { q: "Someone whose judgment you trust points out a real flaw in how you traded. First reaction?",
    opts: [
      { t: "Defend the trade. Explain why it was actually fine.", a: "pride" },
      { t: "Agree completely, then feel too scared to place another trade for days.", a: "fear" },
      { t: "Nod, then trade the exact same way again tomorrow.", a: "impatience" },
      { t: "Half-listen. You're already thinking about the next big trade.", a: "greed" },
      { t: "Take it as proof you're just not cut out for this.", a: "despair" },
    ]},
  { q: "You just had your best week ever. What happens to your size next week?",
    opts: [
      { t: "It goes up. A lot. You're clearly in a groove.", a: "greed" },
      { t: "It goes up — you've proven you deserve to trade bigger now.", a: "pride" },
      { t: "It goes down. You're scared to give the gains back.", a: "fear" },
      { t: "It stays reckless. You were already oversized either way.", a: "impatience" },
      { t: "You half-expect next week to erase it, so it barely feels real.", a: "despair" },
    ]},
  { q: "A textbook setup shows up, exactly by your rules. What actually happens?",
    opts: [
      { t: "You hesitate, and watch it run without you.", a: "fear" },
      { t: "You don't take it. Nothing you've touched lately has worked anyway.", a: "despair" },
      { t: "You'd already taken five worse trades before this one arrived.", a: "impatience" },
      { t: "You take it, but with your own tweak — your version is 'better.'", a: "pride" },
      { t: "You take it, then double your normal size because it's 'the one.'", a: "greed" },
    ]},
  { q: "A trade sits flat for two hours, going nowhere. What do you do?",
    opts: [
      { t: "Close it out of boredom, then open something else immediately.", a: "impatience" },
      { t: "Hold it. Closing flat feels like admitting you were wrong.", a: "pride" },
      { t: "Close for breakeven the second it's available — relief over plan.", a: "fear" },
      { t: "Hold, hoping it turns into more than you planned for.", a: "greed" },
      { t: "Forget you're even in it. You've stopped tracking closely.", a: "despair" },
    ]},
  { q: "You hit your daily loss limit. The rule says stop. What happens?",
    opts: [
      { t: "You keep going. One more trade to fix it.", a: "greed" },
      { t: "You keep going. The limit was a suggestion, not a rule — for you.", a: "pride" },
      { t: "You'd already stopped an hour before the limit was even close.", a: "fear" },
      { t: "You keep going, numbly. It doesn't feel like it matters either way.", a: "despair" },
      { t: "You'd already broken it twice before lunch.", a: "impatience" },
    ]},
  { q: "You see someone post a huge win online. What's the first thing you feel?",
    opts: [
      { t: "Irritation. Your setup was better — you just didn't size it right.", a: "pride" },
      { t: "Urgency to find a trade, any trade, that can do that for you today.", a: "greed" },
      { t: "Doubt. Maybe you're just not good enough to get there.", a: "fear" },
      { t: "Nothing. You stopped expecting that to be you a while ago.", a: "despair" },
      { t: "You jump into a random trade in the next five minutes, chasing it.", a: "impatience" },
    ]},
  { q: "If you're honest — what actually ended your last account?",
    opts: [
      { t: "You couldn't leave a winner alone. Enough was never enough.", a: "greed" },
      { t: "You couldn't hold anything long enough to let a real edge play out.", a: "fear" },
      { t: "You wouldn't admit you were wrong until it was already too late.", a: "pride" },
      { t: "You couldn't wait for anything — the setup, the size, the day.", a: "impatience" },
      { t: "You'd already given up on it working, so you stopped protecting it.", a: "despair" },
    ]},
];

const TOTAL_STEPS = QUESTIONS.length + 1; // +1 for the email gate
let step = 0; // 0-indexed question, or QUESTIONS.length for the gate
const scores = { impatience: 0, greed: 0, fear: 0, pride: 0, despair: 0 };

const app = document.getElementById("app");
const progressFill = document.getElementById("progressFill");

function setProgress(){
  const pct = Math.round((step / TOTAL_STEPS) * 100);
  progressFill.style.width = pct + "%";
}

function computeArchetype(){
  let max = -1;
  Object.keys(scores).forEach(k => { if (scores[k] > max) max = scores[k]; });
  const tied = Object.keys(scores).filter(k => scores[k] === max);
  if (tied.length === 1) return tied[0];
  for (const a of TIE_PRIORITY) if (tied.includes(a)) return a;
  return tied[0];
}

function renderIntro(){
  app.innerHTML = `
    <div class="stage intro-card fx-in">
      <h1>Twelve scenarios.<br>One pattern.</h1>
      <p>No typing. Tap the honest answer, not the correct one. Nobody sees your answers but you.</p>
      <div class="meta"><span>12 questions</span><span>90 seconds</span></div>
      <a class="btn primary" href="#" id="startBtn">Begin</a>
    </div>`;
  document.getElementById("startBtn").addEventListener("click", (e) => {
    e.preventDefault();
    step = 0;
    setProgress();
    renderQuestion();
  });
}

function renderQuestion(){
  const item = QUESTIONS[step];
  const optsHtml = item.opts.map((o, i) =>
    `<button type="button" class="opt" data-a="${o.a}">${o.t}</button>`
  ).join("");
  app.innerHTML = `
    <div class="stage fx-in" id="qStage">
      <div class="q-counter">Question ${step + 1} of ${QUESTIONS.length}</div>
      <div class="q-text">${item.q}</div>
      <div class="q-opts">${optsHtml}</div>
    </div>`;
  document.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      scores[btn.dataset.a] += 1;
      const stage = document.getElementById("qStage");
      stage.classList.remove("fx-in");
      stage.classList.add("fx-out");
      setTimeout(() => {
        step += 1;
        setProgress();
        if (step < QUESTIONS.length) renderQuestion();
        else renderGate();
      }, 260);
    });
  });
}

const KIT_ENDPOINT = "https://app.kit.com/forms/9610192/subscriptions";

async function submitToKit(email, archetype){
  try{
    const store = JSON.parse(localStorage.getItem("niyyah_leads") || "[]");
    store.push({ email, archetype, ts: new Date().toISOString() });
    localStorage.setItem("niyyah_leads", JSON.stringify(store));
  }catch(_){}
  try{
    const res = await fetch(KIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ email_address: email, fields: { archetype } }),
    });
    if(!res.ok) console.warn("Kit responded", res.status, "(lead saved locally)");
  }catch(err){ console.warn("Kit submit failed (lead saved locally):", err); }
}

function renderGate(){
  app.innerHTML = `
    <div class="stage gate-card fx-in">
      <h1>Enter your email to see your diagnosis.</h1>
      <p class="sub">This is where your result goes, so you can find it again. Nothing else.</p>
      <form class="gate-form" id="gateForm" novalidate>
        <input type="email" id="gateEmail" required placeholder="Enter your email" aria-label="Email address" />
        <button class="btn primary" type="submit" id="gateSubmit">See your diagnosis</button>
      </form>
    </div>`;
  const form = document.getElementById("gateForm");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("gateEmail").value.trim();
    if(!email) return;
    const btn = document.getElementById("gateSubmit");
    btn.disabled = true;
    btn.textContent = "One moment...";
    const archetype = computeArchetype();
    try{
      localStorage.setItem("niyyah_archetype", archetype);
      localStorage.setItem("niyyah_email", email);
      localStorage.setItem("niyyah_scores", JSON.stringify(scores));
    }catch(_){}
    submitToKit(email, archetype).finally(() => {
      step = TOTAL_STEPS;
      setProgress();
      window.location.href = "result-" + archetype + ".html";
    });
  });
}

renderIntro();
</script>
</body>
</html>
